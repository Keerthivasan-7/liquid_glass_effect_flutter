name: liquid_glass_effect_flutter
description: Liquid glass surfaces for Flutter with bounded background refraction, material presets, sharp foreground controls and accessible fallbacks.
version: 0.1.0-dev.1
homepage: https://github.com/Keerthivasan-7/liquid_glass_effect_flutter
repository: https://github.com/Keerthivasan-7/liquid_glass_effect_flutter
issue_tracker: https://github.com/Keerthivasan-7/liquid_glass_effect_flutter/issues

platforms:
  android:
  windows:
  web:

screenshots:
  - description: Regular liquid glass and four material presets in the light showcase.
    path: assets/showcase/materials-light.png
  - description: Interactive controls inside glass surfaces in the dark showcase.
    path: assets/showcase/controls-dark.png
  - description: Reduced-transparency comfort preview with opaque readable controls.
    path: assets/showcase/comfort-opaque.png
topics:
  - liquid-glass
  - shaders
  - glassmorphism
  - ui

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/liquid_glass.frag
    - shaders/liquid_glass_capture.frag
